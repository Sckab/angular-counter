<div class="flex flex-col gap-2">
  <span class="w-full text-center text-3xl text-stone-900 dark:text-blue-300">
    {{ number }}
  </span>
  <div class="flex gap-2">
    <app-button (click)="increment()">INCREMENT</app-button>
    <app-button (click)="reset()">RESET</app-button>
    <app-button (click)="decrement()">DECREMENT</app-button>
  </div>
</div>
